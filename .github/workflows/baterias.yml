# Roda TODAS as baterias do repositorio a cada push e a cada PR.
#
# Por que existe: ate 2026-08-17 nenhuma bateria deste repo rodava sozinha. A
# catraca de bytes da injecao (hooks/testa-contexto-sessao.sh) ficou VERMELHA na
# `main` por tres dias — o PR #11 gastou 64 B de nucleo sobre uma folga de 7 B,
# em 14/08, e ninguem viu ate 17/08. A catraca existe para pegar o que passa
# desapercebido, e ela mesma passou desapercebida. Issue #16.
#
# Escolhas, e o que cada uma custa:
#
# - `windows-latest`, e nao `ubuntu-latest`. Este plugin so roda em Windows: le
#   USERPROFILE antes de HOME, converte caminho com `cygpath`, e as baterias sao
#   bash do Git Bash. Verde no Linux provaria que o codigo passa num lugar onde
#   ele nunca vai rodar. O preco e real: repo PRIVADO, e minuto de Windows conta
#   2x na cota do Actions.
#
# - Dois jobs (shards), cada um serial. Em 2026-08-17 eram 20 baterias, ~3 min, e
#   um job so bastava: uma matriz de 20 jobs cortaria o relogio, mas o Actions
#   cobra por job com minuto minimo arredondado (20 x 1 min x 2 = 40 min
#   faturados contra ~8). Hoje sao 168 baterias, ~1858 s (~31 min) em serie num
#   runner de 2 vCPU, e o job unico encostou no teto (Issue #377, ultimo run
#   verde do PR #390: 32m30s). A conta virou: com 2 shards o relogio cai para
#   ~17 min cada (929 s de baterias + o overhead de ~90 s de checkout/setup) e o
#   custo faturado fica igual (2 x 17 contra 1 x 32 min). Dois, e nao mais,
#   porque o overhead fixo por job (~90 s) paga-se so enquanto cada shard ainda
#   carrega muito trabalho. A reparticao e por tempo, nao por contagem:
#   `scripts/repartir-baterias.cjs` poe a bateria mais pesada no shard mais leve,
#   com os pesos de `scripts/tempos-baterias.json` (segundos medidos nesse run).
#   Bateria nova sem peso entra com a mediana; refaca o JSON de tempos em
#   tempos, a reparticao so perde equilibrio, nunca cobertura (a bateria
#   `testa-varrer-baterias.sh` confere uniao == lista inteira, sem repeticao).
#
# - Nao para na primeira falha. Roda o shard inteiro, imprime o placar, e ai
#   decide o exit. Saber que 3 baterias quebraram junto vale mais que saber qual
#   quebrou primeiro.

name: baterias

# SO no PR, e nao mais no push para `main`. Em 2026-08-25 a conta de Actions
# bateu 90% da cota da conta (1.802 de 2.000 min) e o workflow foi desligado na
# mao. Medido no mesmo dia: 168 execucoes em agosto, 6,7 min de relogio em media,
# e minuto de Windows em repo PRIVADO fatura 2x — ~13,3 min faturados por run,
# que e a cota inteira.
#
# O gatilho `push: branches: [main]` saiu porque ele re-prova a MESMA arvore que
# o PR acabou de provar: com merge linear, o commit que entra na `main` tem a
# mesma arvore do head do PR aprovado. Isso corta ~metade das execucoes. O preco
# esta escrito: se duas PRs forem mergeadas em paralelo, a arvore resultante da
# `main` nao foi provada por ninguem — o antidoto e exigir a branch atualizada
# antes do merge, nao pagar um run em toda entrada.
#
# `workflow_dispatch` fica, e passa a ser o jeito de conferir a `main` de
# proposito quando valer a pena.
#
# O que NAO da para fazer aqui, e a razao esta escrita para ninguem tentar de
# novo: `paths-ignore` para arquivo `.md`. Neste repositorio as skills SAO .md, e
# `scripts/orcamento.cjs` mede o tamanho em bytes de `SKILL.md` e dos
# `references/regra-NN.md` contra tetos. Mudanca "so de doc" quebra a catraca de
# bytes com frequencia — foi assim que a Issue #79 nasceu. Filtrar por caminho
# aqui desligaria justamente o teste que a mudanca de doc precisa.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push novo na mesma PR cancela o run anterior — ele ia provar uma arvore que
# nao existe mais. Em agosto a branch `auditor-de-api-owasp` sozinha acendeu o
# runner 4 vezes; com isto teria acendido uma.
concurrency:
  group: baterias-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baterias:
    runs-on: windows-latest
    # 35, e nao 20, porque 20 virou cara ou coroa. Medido em 2026-09-08 nos doze
    # runs anteriores: os que passam chegam em 18-19 min, e CINCO morreram em
    # 20-21 min com o placar "as N baterias passaram" JA IMPRESSO — verde, e
    # cancelado no ultimo segundo (`fluxo/limpar-nao-sai-do-repo`,
    # `fluxo/contrato-de-territorio-advpl`, `fluxo/agentes-em-codex`, e este). Um
    # teto a 1 minuto do tempo real nao e guarda-corpo: e ruido que ensina a
    # reapertar botao ate dar sorte, e o dia em que a bateria quebrar de verdade
    # ninguem vai acreditar no vermelho.
    #
    # O teto continua existindo para pegar bateria PENDURADA (stdin aberto,
    # espera de rede), que e o modo de falha que ele deve pegar — e para isso 35
    # serve igual. Se o tempo real encostar em 30, o conserto e a suite ficar mais
    # barata, nao este numero subir de novo.
    timeout-minutes: 35
    # Node 24 so, a mesma versao da maquina do Luis (2026-09-22). De 2026-09 ate
    # aqui foi matriz 22 E 24 (Issue #161): o testa-limpar-branches ficou verde
    # no 22 e vermelho no 24 (DEP0190 no stderr contaminando um JSON.parse),
    # porque o CI rodava so numa versao e a maquina estava em outra. A licao
    # daquela issue era CI e maquina na mesma versao — com as duas no 24, o
    # segundo job so dobrava a espera. Ao trocar o Node da maquina, troque aqui
    # junto.
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
        shard: [1, 2]
    name: baterias (node ${{ matrix.node }}, shard ${{ matrix.shard }}/2)

    defaults:
      run:
        shell: bash # no runner Windows isto e o Git Bash — o mesmo shell da maquina do Luis

    steps:
      - name: Checkout com historico
        uses: actions/checkout@v4
        with:
          # testa-saude.sh monta cenarios contando o DAG e testa-limpar-branches.sh
          # exercita branch com remoto. Clone raso mente para os dois.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preflight — as ferramentas existem, e a arvore veio em LF
        run: |
          set -u
          falta=0
          for t in bash node python3 git cygpath; do
            if command -v "$t" >/dev/null 2>&1; then
              printf '  ok    %-8s %s\n' "$t" "$(command -v "$t")"
            else
              printf '  FALTA %s\n' "$t"; falta=1
            fi
          done
          [ "$falta" -eq 0 ] || { echo "ferramenta ausente — as baterias nao significariam nada"; exit 1; }

          # O .gitattributes manda `* text=auto eol=lf`. Se o checkout entregasse
          # CRLF, cada linha de regra ganharia um byte e a catraca dos nucleos
          # acusaria uma regressao que nao existe. Falhar aqui nomeia a causa.
          if git ls-files --eol skills hooks | grep -q 'w/crlf'; then
            echo "FALHA arquivo em CRLF na arvore de trabalho — a contagem de bytes da injecao vai mentir"
            git ls-files --eol skills hooks | grep 'w/crlf' | head
            exit 1
          fi
          echo "  ok    arvore em LF"

      # O endereco abaixo e sintetico: TLD .invalid (RFC 2606), que o gate de
      # publicacao nao trata como e-mail real. Por isso o arquivo dispensa o
      # marcador de dados de exemplo e continua escaneado inteiro.
      - name: Identidade git — o runner nao tem, a maquina do Luis tem
        run: |
          # Rede, nao conserto. Isto entrou apostando que era a causa das baterias
          # vermelhas — NAO era: com o step no lugar, as mesmas 4 continuaram
          # vermelhas (mesma execucao). As causas reais estao no corpo do PR #17.
          #
          # Fica porque a afirmacao continua verdadeira e o custo e zero: o runner
          # nao tem `user.email` global, e hoje toda bateria que commita seta a
          # identidade por repo. No dia em que uma esquecer, sem isto aqui ela sai
          # `128 Author identity unknown` — falha que nao diz nada sobre o que a
          # bateria testa. Identidade de commit e ambiente de maquina, entao o
          # lugar dela e o workflow.
          #
          # O que este step NAO faz, de proposito: plantar `~/.rainforest` ou
          # FOCO.md sinteticos. Isso deixaria o CI verde alimentando as baterias
          # com o acoplamento que elas nao deviam ter.
          git config --global user.email "ci@rainforest.invalid"
          git config --global user.name "CI das baterias"
          git config --global init.defaultBranch master # o mesmo default da maquina do Luis (unset la tambem)

      # Preflight e identidade git rodam nos dois shards: cada job e um runner
      # proprio, e sao o ambiente das baterias. Esta conferencia, ao contrario, e
      # sobre a ARVORE (nao depende do runner) e daria o mesmo resultado nos dois:
      # so o shard 1 paga, e nenhuma checagem se perde.
      - name: Versao do manifesto sobe em relacao a origin/main
        if: matrix.shard == 1
        run: node scripts/conferir-versao.cjs

      - name: Rodar as baterias (shard ${{ matrix.shard }}/2)
        run: bash scripts/varrer-baterias.sh --shard ${{ matrix.shard }}/2

      # Passo separado, de proposito (D5): o gemeo em Python de conferir-entrega.cjs
      # so aparece quando alguem digita o CONFERIR override na mao — por isso
      # congelou tres semanas sem ninguem ver (Issue #303). O runner ja garante
      # `python` (comentario de scripts/testa-dependencias-de-bateria.sh: "cria
      # python3 alem de python"), entao a linha e a MESMA que o CONTRIBUTING manda
      # rodar antes de abrir PR — provar o gemeo aqui e provar o que o contribuidor
      # roda na propria maquina, nao um substituto.
      # So no shard 1: e uma unica bateria sobre o gemeo, o resultado nao depende
      # de qual shard a roda, e repeti-la no 2 so gastaria minuto de Windows.
      - name: Rodar a bateria do gemeo em Python (conferir-entrega)
        if: matrix.shard == 1
        run: CONFERIR="python scripts/conferir-entrega.py" bash scripts/testa-conferir-entrega.sh
