schema_version: "1.0"
name: gatilho-arqueologia-vs-analisar
description: >
  Pedido "mapeia esse código" (issue #302) tem que acionar `arqueologia`, não
  `analisar` — arqueologia mapeia uma fatia de código legado sem mapa antes
  do brainstorm decidir sobre ela; analisar é método para EDA/notebook em
  Python/pandas (dataset, DataFrame), um domínio diferente.
tags: [gatilho, colisao]

execution:
  prompt: "mapeia esse código"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]

graders:
  - type: tool_used
    name: aciona-arqueologia
    tool: Skill
    input_match: "rainforest-mind:arqueologia"
    arm: both

  - type: tool_used
    name: nao-aciona-analisar
    tool: Skill
    input_match: "rainforest-mind:analisar"
    min: 0
    max: 0
    arm: both

  - type: llm
    name: resposta-segue-metodo-arqueologia
    criteria: >
      A resposta trata o pedido como mapear uma fatia de código legado
      (arquivo/mapa com escala de confiança, sem gerar código) — não como
      uma análise de dados em notebook (DataFrame, EDA, pandas). Vale mesmo
      que a resposta só peça qual código/pasta mapear antes de agir, desde
      que o enquadramento seja o de arqueologia, não o de análise de dados.
    weight: 1
