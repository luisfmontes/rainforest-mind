schema_version: "1.0"
name: gatilho-verificar-vs-revisar
description: >
  Pedido "roda o critério" (issue #302) tem que acionar `verificar`, não
  `revisar` — verificar roda o critério de cada tarefa do plano contra o
  artefato real e decide ok/reprovado, sem nunca redigir critério novo;
  revisar é a revisão independente contra o diff, antes de `verificar`.
tags: [gatilho, colisao]

execution:
  prompt: "roda o critério"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]

runs: 1

graders:
  - type: tool_used
    name: aciona-verificar
    tool: Skill
    input_match: "rainforest-mind:verificar"
    arm: both

  - type: tool_used
    name: nao-aciona-revisar
    tool: Skill
    input_match: "rainforest-mind:revisar"
    min: 0
    max: 0
    arm: both

  - type: llm
    name: resposta-segue-metodo-verificar
    criteria: >
      A resposta trata o pedido como executar o critério de aceite que o
      plano já definiu contra o artefato real, decidindo ok ou reprovado —
      não como uma revisão independente nova nem como redigir critério. Vale
      mesmo que a resposta só peça qual plano/tarefa antes de agir, desde
      que o enquadramento seja o de verificar, não o de revisar.
    weight: 1
