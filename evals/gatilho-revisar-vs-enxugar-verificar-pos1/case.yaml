schema_version: "1.0"
name: gatilho-revisar-vs-enxugar-verificar-pos1
description: >
  Cenário realista de desconfiar do relato de quem implementou (issue #302,
  par revisar×enxugar/verificar) — tem que acionar `revisar`, não `enxugar`
  nem `verificar`: é revisão independente contra o diff real, antes de
  rodar qualquer critério de aceite.
tags: [gatilho, colisao, positivo]

execution:
  prompt: >
    O agente terminou a tarefa 3 e reportou tudo certo, mas quero uma
    segunda opinião independente batendo contra o diff real antes de deixar
    passar pra etapa de critério. Ainda não rodei nenhum critério de
    aceite dessa entrega.
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]

graders:
  - type: tool_used
    name: aciona-revisar
    tool: Skill
    input_match: "rainforest-mind:revisar"
    arm: with-only

  - type: tool_used
    name: nao-aciona-enxugar
    tool: Skill
    input_match: "rainforest-mind:enxugar"
    min: 0
    max: 0
    arm: both

  - type: tool_used
    name: nao-aciona-verificar
    tool: Skill
    input_match: "rainforest-mind:verificar"
    min: 0
    max: 0
    arm: both

  - type: llm
    name: resposta-segue-metodo-revisar
    criteria: >
      A resposta trata o pedido como uma revisão independente contra o
      diff real de uma entrega — não como um levantamento de código morto
      (enxugar), nem como rodar um critério de aceite já definido num
      plano (verificar). Vale mesmo que a resposta só peça qual entrega
      revisar antes de agir, desde que o enquadramento seja o de revisar.
    weight: 1
