schema_version: "1.0"
name: gatilho-divergir-vs-brainstorm
description: >
  Pedido "qual desses caminhos" (issue #302) tem que acionar `divergir`, não
  `brainstorm` — divergir abre o espaço de decisão em paralelo quando já há
  mais de um caminho na mesa; brainstorm converge por entrevista adversarial
  quando ainda não existe design nenhum aprovado.
tags: [gatilho, colisao]

execution:
  prompt: "qual desses caminhos"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]

graders:
  - type: tool_used
    name: aciona-divergir
    tool: Skill
    input_match: "rainforest-mind:divergir(?!-frames)"
    arm: both

  - type: tool_used
    name: nao-aciona-brainstorm
    tool: Skill
    input_match: "rainforest-mind:brainstorm"
    min: 0
    max: 0
    arm: both

  - type: llm
    name: resposta-segue-metodo-divergir
    criteria: >
      A resposta trata o pedido como abrir o espaço de decisão (várias opções
      em paralelo, depois um crítico separado) — não como uma entrevista
      adversarial que converge para um único design já aprovado. Vale mesmo
      que a resposta só peça mais contexto antes de agir, desde que o
      enquadramento seja o de divergir, não o de convergir direto.
    weight: 1
