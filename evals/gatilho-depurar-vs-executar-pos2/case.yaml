schema_version: "1.0"
name: gatilho-depurar-vs-executar-pos2
description: >
  Cenário realista de regressão de performance sem mudança de lógica
  (issue #302, par depurar×executar) — tem que acionar `depurar`, não
  `executar`: é investigação de um sintoma que varia entre execuções, não
  um plano já aprovado.
tags: [gatilho, colisao, positivo]

execution:
  prompt: >
    Depois que subi a versão nova do worker de sincronização, ele ficou
    muito mais lento — antes levava uns 2 minutos, agora varia entre 10 e
    20 minutos, sem eu ter tocado na lógica de negócio. Já rodei três vezes
    e o tempo não é sempre o mesmo.
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]

graders:
  - type: tool_used
    name: aciona-depurar
    tool: Skill
    input_match: "rainforest-mind:depurar"
    arm: with-only

  - type: tool_used
    name: nao-aciona-executar
    tool: Skill
    input_match: "rainforest-mind:executar"
    min: 0
    max: 0
    arm: both

  - type: llm
    name: resposta-segue-metodo-depurar
    criteria: >
      A resposta trata o pedido como uma regressão de performance a
      investigar (loop de feedback, medição antes de hipótese) — não como
      uma tarefa mecânica de execução direta nem como um plano já fechado
      para despachar. Vale mesmo que a resposta só peça mais contexto
      (métrica exata, diff da versão nova) antes de agir, desde que o
      enquadramento seja o de investigar, não o de executar um plano.
    weight: 1
