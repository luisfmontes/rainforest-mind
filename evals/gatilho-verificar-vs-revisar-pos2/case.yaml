schema_version: "1.0"
name: gatilho-verificar-vs-revisar-pos2
description: >
  Cenário realista de conferir critérios numerados após execução e
  revisão (issue #302, par verificar×revisar) — tem que acionar
  `verificar`, não `revisar`.
tags: [gatilho, colisao, positivo]

execution:
  prompt: >
    Terminamos de executar e revisar as três tarefas do plano da migração
    de autenticação. Bora confirmar se cada critério numerado que já
    estava escrito no plano realmente passa contra o que foi entregue?
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]

graders:
  - type: tool_used
    name: aciona-verificar
    tool: Skill
    input_match: "rainforest-mind:verificar"
    arm: with-only

  - type: tool_used
    name: nao-aciona-revisar
    tool: Skill
    input_match: "rainforest-mind:revisar"
    min: 0
    max: 0
    arm: both

  - type: llm
    name: resposta-segue-metodo-verificar
    criteria: >
      A resposta trata o pedido como rodar os critérios já numerados no
      plano contra o artefato entregue, decidindo ok/reprovado por
      critério — não como uma revisão independente nova. Vale mesmo que
      a resposta só peça qual plano/critério antes de agir, desde que o
      enquadramento seja o de verificar.
    weight: 1
